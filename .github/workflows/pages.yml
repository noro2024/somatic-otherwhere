name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run build
      - run: npm ci
        working-directory: ver2
      - run: npm run assets
        working-directory: ver2
      - run: npm run build
        working-directory: ver2
      - name: Package ver2
        run: |
          cp -R ver2/dist dist/ver2
          (cd ver2/dist && zip -qr ../../dist/somatic-otherwhere-ver2-web.zip .)
          zip -qr dist/somatic-otherwhere-ver2-source.zip ver2 -x 'ver2/node_modules/*' 'ver2/dist/*'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
